<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <h2>Login Admin</h2>
  <div id="login-form">
    <input type="email" id="email" placeholder="Email"><br><br>
    <input type="password" id="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
  </div>

  <div id="admin-panel" style="display:none;">
    <h2>Data Transaksi</h2>
    <button onclick="loadData()">Muat Data</button>

    <h3>Tambah Transaksi</h3>
    <input type="text" id="nama" placeholder="Nama">
    <input type="number" id="jumlah" placeholder="Jumlah">
    <input type="text" id="status" placeholder="Status">
    <button onclick="tambahTransaksi()">Tambah</button>

    <table border="1" id="data-table" style="margin-top:20px;">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nama</th>
          <th>Jumlah</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const supabaseUrl = ''https://quyqpwzjecfrwbfpejvx.supabase.co'; // Ganti dengan URL kamu
    const supabaseKey = 'process.env.SUPABASE_KEY';                // Ganti dengan Anon Key kamu
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alert('Login gagal: ' + error.message);
        return;
      }

      document.getElementById('login-form').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      loadData();
    }

    async function loadData() {
      const { data, error } = await supabase.from('transaksi').select('*');

      if (error) {
        alert('Gagal memuat data: ' + error.message);
        return;
      }

      const tbody = document.querySelector('#data-table tbody');
      tbody.innerHTML = '';

      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.id}</td>
          <td>${row.nama}</td>
          <td>${row.jumlah}</td>
          <td>${row.status}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function tambahTransaksi() {
      const nama = document.getElementById('nama').value;
      const jumlah = parseInt(document.getElementById('jumlah').value);
      const status = document.getElementById('status').value;

      const { error } = await supabase.from('transaksi').insert([{ nama, jumlah, status }]);

      if (error) {
        alert('Gagal menambah: ' + error.message);
      } else {
        alert('Berhasil tambah!');
        loadData();
      }
    }
  </script>
</body>
</html>
